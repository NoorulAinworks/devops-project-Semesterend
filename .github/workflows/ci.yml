name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build, test and package
        run: make ci
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops-pipeline
          path: '*.tgz'
          if-no-files-found: error
